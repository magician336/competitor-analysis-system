version: 1

defaults:
  request_timeout_seconds: 15
  requests_per_second_per_domain: 1.0
  max_retries: 3
  since_days: 90
  max_issues: 100
  max_comments: 20
  minimum_visible_text_chars: 200

competitors:
  - id: cursor
    name: Cursor
    aliases: [Cursor AI]
    sources:
      official:
        enabled: true
        evidence_level: A
        urls:
          - https://cursor.com/
      changelog:
        enabled: true
        evidence_level: A
        urls:
          - https://cursor.com/changelog
      pricing:
        enabled: true
        evidence_level: A
        urls:
          - https://cursor.com/pricing
      product_docs:
        enabled: true
        evidence_level: A
        urls:
          - https://cursor.com/docs
          - https://docs.cursor.com/models
          - https://docs.cursor.com/en/agent/overview
      status_page:
        enabled: true
        evidence_level: A
        urls:
          - https://status.cursor.com/history
      github:
        enabled: false
        evidence_level: B
        repositories: []
        note: cursor/cursor does not publish product releases or accept issues.
      plugin_marketplace:
        enabled: false
        evidence_level: B
        urls: []
        note: Cursor is distributed as a standalone editor and has no verified first-party VS Code or JetBrains listing.
      community:
        enabled: true
        evidence_level: C
        urls:
          - https://forum.cursor.com/
      review:
        enabled: false
        evidence_level: C
        urls: []
        note: Third-party video and review URLs require a curated allowlist before collection.
      security_privacy:
        enabled: true
        evidence_level: A
        urls:
          - https://cursor.com/security
          - https://cursor.com/privacy
      benchmark:
        enabled: true
        evidence_level: B
        urls:
          - https://cursor.com/blog/composer-2-technical-report

  - id: github_copilot
    name: GitHub Copilot
    aliases: [Copilot, GitHub Copilot Chat]
    sources:
      official:
        enabled: true
        evidence_level: A
        urls:
          - https://github.com/features/copilot
      changelog:
        enabled: true
        evidence_level: A
        urls:
          - https://github.blog/changelog/label/copilot/
      pricing:
        enabled: true
        evidence_level: A
        urls:
          - https://github.com/features/copilot/plans
      product_docs:
        enabled: true
        evidence_level: A
        urls:
          - https://docs.github.com/en/copilot
          - https://docs.github.com/en/copilot/get-started
          - https://docs.github.com/en/copilot/reference
      status_page:
        enabled: true
        evidence_level: A
        urls:
          - https://www.githubstatus.com/history
      github:
        enabled: true
        evidence_level: B
        repositories:
          - microsoft/vscode-copilot-chat
      plugin_marketplace:
        enabled: true
        evidence_level: B
        urls:
          - https://marketplace.visualstudio.com/items?itemName=GitHub.copilot
      community:
        enabled: true
        evidence_level: C
        urls:
          - https://github.com/orgs/community/discussions/categories/copilot
      review:
        enabled: false
        evidence_level: C
        urls: []
        note: Third-party video and review URLs require a curated allowlist before collection.
      security_privacy:
        enabled: true
        evidence_level: A
        urls:
          - https://github.com/trust-center
          - https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
      benchmark:
        enabled: true
        evidence_level: B
        urls:
          - https://github.blog/news-insights/research/does-github-copilot-improve-code-quality-heres-what-the-data-says/

  - id: trae
    name: Trae
    aliases: [TRAE, TRAE IDE]
    sources:
      official:
        enabled: true
        evidence_level: A
        urls:
          - https://www.trae.ai/
      changelog:
        enabled: true
        evidence_level: A
        urls:
          - https://www.trae.ai/changelog
      pricing:
        enabled: true
        evidence_level: A
        urls:
          - https://www.trae.ai/pricing
      product_docs:
        enabled: true
        evidence_level: A
        urls:
          - https://docs.trae.ai/
      status_page:
        enabled: false
        evidence_level: A
        urls: []
        note: No verified public TRAE service-status page is available.
      github:
        enabled: true
        evidence_level: B
        repositories:
          - Trae-AI/TRAE
      plugin_marketplace:
        enabled: true
        evidence_level: B
        urls:
          - https://marketplace.visualstudio.com/items?itemName=MarsCode.marscode-extension
      community:
        enabled: false
        evidence_level: C
        urls: []
        note: TRAE community links point to interactive Discord channels; GitHub Issues provide the machine-readable feedback source.
      review:
        enabled: false
        evidence_level: C
        urls: []
        note: Third-party video and review URLs require a curated allowlist before collection.
      security_privacy:
        enabled: true
        evidence_level: A
        urls:
          - https://www.trae.ai/privacy-policy
          - https://www.trae.ai/terms-of-service
      benchmark:
        enabled: true
        evidence_level: B
        urls:
          - https://www.trae.ai/blog/product_update_0528

  - id: tongyi_lingma
    name: 通义灵码
    aliases: [Lingma, Qoder CN, 智能编码助手通义灵码]
    sources:
      official:
        enabled: true
        evidence_level: A
        urls:
          - https://lingma.aliyun.com/
      changelog:
        enabled: true
        evidence_level: A
        # Aliyun exposes a server-rendered directory whose child links carry
        # their dates on the target pages rather than on this index page.
        undated_entry_selector: ".aliyun-docs-content .markdown-body .directory a[href]"
        undated_entry_path_prefixes:
          - /zh/lingma/
        undated_entry_text_pattern: "更新日志|日志（存档）|产品公告"
        undated_detail_root_selector: ".aliyun-docs-content .markdown-body"
        urls:
          - https://help.aliyun.com/zh/lingma/product-overview/dynamics-and-announcements/
      pricing:
        enabled: true
        evidence_level: A
        urls:
          - https://help.aliyun.com/zh/lingma/product-overview/billing-description
      product_docs:
        enabled: true
        evidence_level: A
        urls:
          - https://help.aliyun.com/zh/lingma/
          - https://help.aliyun.com/zh/lingma/user-guide/overview-of-chat
          - https://help.aliyun.com/zh/lingma/user-guide/enterprise-knowledge-base-q-a/
      status_page:
        enabled: false
        evidence_level: A
        urls: []
        note: No verified product-specific public service-status page is available for 通义灵码.
      github:
        enabled: false
        evidence_level: B
        repositories: []
        note: No official public product issue repository is available.
      plugin_marketplace:
        enabled: true
        evidence_level: B
        urls:
          - https://marketplace.visualstudio.com/items?itemName=Alibaba-Cloud.tongyi-lingma
      community:
        enabled: false
        evidence_level: C
        urls: []
        note: Product feedback is handled through DingTalk and in-product forms without a stable public listing page.
      review:
        enabled: false
        evidence_level: C
        urls: []
        note: Third-party video and review URLs require a curated allowlist before collection.
      security_privacy:
        enabled: true
        evidence_level: A
        urls:
          - https://help.aliyun.com/zh/lingma/service-agreement-and-privacy-policy
      benchmark:
        enabled: false
        evidence_level: B
        urls: []
        note: No verified product-specific public benchmark report is available.

  - id: codegeex
    name: CodeGeeX
    aliases: [CodeGeeX4, CodeGeeX AI Coding Assistant]
    sources:
      official:
        enabled: true
        evidence_level: A
        urls:
          - https://www.codegeex.cn/
      changelog:
        enabled: false
        evidence_level: A
        urls: []
        note: Product updates are collected from GitHub releases.
      pricing:
        enabled: false
        evidence_level: A
        urls: []
        note: The public product site presents the assistant as free and has no standalone pricing page.
      product_docs:
        enabled: true
        evidence_level: A
        urls:
          - https://v4-enterprise.codegeex.cn/docs/guide/user_manual.html
      status_page:
        enabled: false
        evidence_level: A
        urls: []
        note: No verified public CodeGeeX service-status page is available.
      github:
        enabled: true
        evidence_level: B
        repositories:
          - zai-org/CodeGeeX
          - zai-org/CodeGeeX4
      plugin_marketplace:
        enabled: true
        evidence_level: B
        urls:
          - https://marketplace.visualstudio.com/items?itemName=aminer.codegeex
          - https://plugins.jetbrains.com/plugin/20587-codegeex-ai-coding-assistant
      community:
        enabled: false
        evidence_level: C
        urls: []
        note: Public user feedback is collected from the configured GitHub repositories.
      review:
        enabled: false
        evidence_level: C
        urls: []
        note: Third-party video and review URLs require a curated allowlist before collection.
      security_privacy:
        enabled: false
        evidence_level: A
        urls: []
        note: No verified product-specific public security or privacy page is available.
      benchmark:
        enabled: true
        evidence_level: B
        urls:
          - https://github.com/zai-org/CodeGeeX
