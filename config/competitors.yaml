version: 2

defaults:
  request_timeout_seconds: 15
  requests_per_second_per_domain: 1.0
  max_retries: 3
  since_days: 90
  max_issues: 100
  max_comments: 20
  minimum_visible_text_chars: 200

competitors:
  - id: cursor
    name: Cursor
    aliases: [Cursor AI]
    sources:
      official:
        enabled: true
        evidence_level: A
        urls:
          - https://cursor.com/
          - https://cursor.com/product
          - https://cursor.com/cloud
          - https://cursor.com/bugbot
          - https://cursor.com/enterprise
          - https://cursor.com/students
          - https://cursor.com/education
      changelog:
        enabled: true
        evidence_level: A
        urls:
          - https://cursor.com/changelog
      rss:
        enabled: false
        evidence_level: B
        format: rss
        urls: []
        note: Cursor does not expose a verified current official RSS or Atom feed.
      pricing:
        enabled: true
        evidence_level: A
        urls:
          - https://cursor.com/pricing
      product_docs:
        enabled: true
        evidence_level: A
        embedded_content: cursor_next_rsc
        sitemap_discovery:
          enabled: true
          urls:
            - https://cursor.com/docs/sitemap.xml
          allowed_path_prefixes:
            - /docs/
          excluded_path_prefixes:
            - /docs-static/
            - /docs/page.mdx
          max_urls: 200
          max_sitemaps: 2
        urls:
          - https://cursor.com/docs
          - https://cursor.com/docs/models-and-pricing
          - https://cursor.com/docs/agent/overview
      status_page:
        enabled: true
        evidence_level: A
        urls:
          - https://status.cursor.com/history
          - https://status.cursor.com/history.rss
      github:
        enabled: false
        evidence_level: B
        repositories: []
        note: cursor/cursor does not publish product releases or accept issues.
      plugin_marketplace:
        enabled: false
        evidence_level: B
        urls: []
        note: Cursor is distributed as a standalone editor and has no verified first-party VS Code or JetBrains listing.
      community:
        enabled: true
        evidence_level: C
        urls:
          - https://forum.cursor.com/
          - https://forum.cursor.com/latest.rss
          - https://forum.cursor.com/latest.json?page=0
          - https://forum.cursor.com/latest.json?page=1
          - https://forum.cursor.com/latest.json?page=2
          - https://forum.cursor.com/latest.json?page=3
          - https://forum.cursor.com/latest.json?page=4
          - https://forum.cursor.com/latest.json?page=5
          - https://forum.cursor.com/latest.json?page=6
          - https://forum.cursor.com/latest.json?page=7
          - https://forum.cursor.com/latest.json?page=8
          - https://forum.cursor.com/latest.json?page=9
          - https://forum.cursor.com/latest.json?page=10
          - https://forum.cursor.com/latest.json?page=11
          - https://forum.cursor.com/latest.json?page=12
          - https://forum.cursor.com/latest.json?page=13
          - https://forum.cursor.com/latest.json?page=14
          - https://forum.cursor.com/latest.json?page=15
          - https://forum.cursor.com/latest.json?page=16
          - https://forum.cursor.com/latest.json?page=17
          - https://forum.cursor.com/latest.json?page=18
          - https://forum.cursor.com/latest.json?page=19
        json_items:
          result_path: topic_list.topics
          title_field: fancy_title
          content_fields:
            - excerpt
            - tags
            - posts_count
            - reply_count
            - views
            - like_count
            - last_posted_at
          url_template: /t/{slug}/{id}
          url_base: https://forum.cursor.com
          publish_time_field: created_at
          author_field: posters.0.user_id
          identity_template: topic:{id}
          identity_mode: configured
      review:
        enabled: true
        evidence_level: C
        urls:
          - https://devtoolsreview.com/reviews/cursor-review/
          - https://www.techradar.com/pro/security/top-ai-coding-agents-can-be-easy-victims-to-sandbox-escapes-showing-they-arent-as-secure-as-they-claim-to-be
          - https://aitoolgrade.com/review/cursor.html
        note: URLs form the curated public review allowlist for Cursor.
      security_privacy:
        enabled: true
        evidence_level: A
        urls:
          - https://cursor.com/security
          - https://cursor.com/privacy
      benchmark:
        enabled: true
        evidence_level: B
        urls:
          - https://cursor.com/blog/composer-2-technical-report

