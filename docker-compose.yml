services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
    mem_limit: 2g
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - coderadar_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: ${MINIRAG_INSTALL_ML:-false}
    environment:
      MINIRAG_DOCUMENTS_PATH: /app/CodeRadar/data/cleaned/documents.jsonl
      MINIRAG_ELASTICSEARCH_URL: http://elasticsearch:9200
      MINIRAG_CONFIG_PATH: /app/CodeRadar/config/mini_rag.yaml
      MINIRAG_TRACE_PATH: /app/CodeRadar/data/runtime/retrieval_traces.jsonl
      MINIRAG_EMBEDDING_PROVIDER: ${MINIRAG_EMBEDDING_PROVIDER:-hash}
      MINIRAG_EMBEDDING_MODEL: ${MINIRAG_EMBEDDING_MODEL:-BAAI/bge-m3}
      MINIRAG_EMBEDDING_DIMENSION: ${MINIRAG_EMBEDDING_DIMENSION:-1024}
      MINIRAG_MODEL_CACHE_DIR: /root/.cache/huggingface
      MINIRAG_RERANKER_PROVIDER: ${MINIRAG_RERANKER_PROVIDER:-lexical}
      MINIRAG_RERANKER_MODEL: ${MINIRAG_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/CodeRadar/data
      - coderadar_model_cache:/root/.cache/huggingface
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  coderadar_es_data:
  coderadar_model_cache:
