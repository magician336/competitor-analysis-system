services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
    mem_limit: 2g
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - coderadar_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: ${MINIRAG_INSTALL_ML:-false}
    environment:
      CODERADAR_DATABASE_URL: ${CODERADAR_DATABASE_URL:-sqlite:///data/runtime/coderadar.db}
      CODERADAR_AUTH_ENABLED: ${CODERADAR_AUTH_ENABLED:-true}
      CODERADAR_API_KEY: ${CODERADAR_API_KEY:-}
      CODERADAR_READ_RATE_PER_MINUTE: ${CODERADAR_READ_RATE_PER_MINUTE:-120}
      CODERADAR_WRITE_RATE_PER_MINUTE: ${CODERADAR_WRITE_RATE_PER_MINUTE:-30}
      CODERADAR_CORS_ORIGINS: ${CODERADAR_CORS_ORIGINS:-http://localhost:8080}
      CODERADAR_AGENT_MODE: ${CODERADAR_AGENT_MODE:-rules}
      CODERADAR_LLM_PROVIDER: ${CODERADAR_LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      CODERADAR_LLM_TIMEOUT_SECONDS: ${CODERADAR_LLM_TIMEOUT_SECONDS:-45}
      CODERADAR_LLM_MAX_TOKENS: ${CODERADAR_LLM_MAX_TOKENS:-}
      CODERADAR_LLM_MAX_RETRIES: ${CODERADAR_LLM_MAX_RETRIES:-2}
      # ── Mini-RAG 路径（相对于容器内项目根目录） ──────────────
      MINIRAG_DOCUMENTS_PATH: ${MINIRAG_DOCUMENTS_PATH:-data/cleaned/documents.jsonl}
      MINIRAG_ELASTICSEARCH_URL: http://elasticsearch:9200
      MINIRAG_CONFIG_PATH: ${MINIRAG_CONFIG_PATH:-}
      MINIRAG_TRACE_PATH: ${MINIRAG_TRACE_PATH:-data/runtime/retrieval_traces.jsonl}
      MINIRAG_MODEL_CACHE_DIR: ${MINIRAG_MODEL_CACHE_DIR:-.cache/models}
      # ── Mini-RAG Profile（一键切换配置集） ──────────────────
      # default → config/mini_rag.yaml（hash + lexical）
      # formal  → config/mini_rag.formal.yaml（BGE-M3 + Cross-Encoder）
      MINIRAG_PROFILE: ${MINIRAG_PROFILE:-default}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      # 直接访问 API 的端口（调试用）。生产流量统一走前端 nginx 反向代理。
      - "127.0.0.1:${CODERADAR_API_PORT:-8001}:8000"
    volumes:
      - ./data:/app/CodeRadar/data
      - coderadar_runtime_data:/app/CodeRadar/data/runtime
      - coderadar_model_cache:/app/CodeRadar/.cache/models
    dns:
      - 223.5.5.5
      - 1.1.1.1
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: ${MINIRAG_INSTALL_ML:-false}
    command: ["python", "-m", "scripts.run_workflow_worker"]
    environment:
      CODERADAR_DATABASE_URL: ${CODERADAR_DATABASE_URL:-sqlite:///data/runtime/coderadar.db}
      # ── Mini-RAG 路径（相对于容器内项目根目录） ──────────────
      MINIRAG_DOCUMENTS_PATH: ${MINIRAG_DOCUMENTS_PATH:-data/cleaned/documents.jsonl}
      MINIRAG_ELASTICSEARCH_URL: http://elasticsearch:9200
      MINIRAG_CONFIG_PATH: ${MINIRAG_CONFIG_PATH:-}
      MINIRAG_TRACE_PATH: ${MINIRAG_TRACE_PATH:-data/runtime/retrieval_traces.jsonl}
      MINIRAG_MODEL_CACHE_DIR: ${MINIRAG_MODEL_CACHE_DIR:-.cache/models}
      # ── Mini-RAG Profile ────────────────────────────────────
      MINIRAG_PROFILE: ${MINIRAG_PROFILE:-default}
      # ── Worker 工作流参数 ───────────────────────────────────
      CODERADAR_WORKFLOW_POLL_SECONDS: ${CODERADAR_WORKFLOW_POLL_SECONDS:-1}
      CODERADAR_WORKFLOW_LEASE_SECONDS: ${CODERADAR_WORKFLOW_LEASE_SECONDS:-30}
      CODERADAR_WORKFLOW_HEARTBEAT_SECONDS: ${CODERADAR_WORKFLOW_HEARTBEAT_SECONDS:-10}
      CODERADAR_WORKFLOW_TIMEOUT_SECONDS: ${CODERADAR_WORKFLOW_TIMEOUT_SECONDS:-300}
      # ── Agent 与 LLM ────────────────────────────────────────
      CODERADAR_AGENT_MODE: ${CODERADAR_AGENT_MODE:-rules}
      CODERADAR_LLM_PROVIDER: ${CODERADAR_LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      CODERADAR_LLM_TIMEOUT_SECONDS: ${CODERADAR_LLM_TIMEOUT_SECONDS:-45}
      CODERADAR_LLM_MAX_TOKENS: ${CODERADAR_LLM_MAX_TOKENS:-}
      CODERADAR_LLM_MAX_RETRIES: ${CODERADAR_LLM_MAX_RETRIES:-2}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./data:/app/CodeRadar/data
      - coderadar_runtime_data:/app/CodeRadar/data/runtime
      - coderadar_model_cache:/app/CodeRadar/.cache/models
    dns:
      - 223.5.5.5
      - 1.1.1.1
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${CODERADAR_UI_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  coderadar_es_data:
  coderadar_model_cache:
  coderadar_runtime_data:

